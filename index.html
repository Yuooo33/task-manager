<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>任务管理器</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="page">
  <header class="app-header">
    <div class="title-block">
      <h1>任务管理器</h1>
      <p class="subtitle">数据实时同步至 Supabase <span class="dot"></span> <span id="conn-state">连接中…</span></p>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">全部</span></div>
      <div class="stat"><span class="stat-num" id="stat-active">0</span><span class="stat-label">进行中</span></div>
      <div class="stat"><span class="stat-num" id="stat-done">0</span><span class="stat-label">已完成</span></div>
    </div>
  </header>

  <section class="composer">
    <input id="task-title" type="text" maxlength="120" placeholder="要做什么？例如：整理周会纪要" autocomplete="off" />
    <div class="priority-picker" role="group" aria-label="优先级">
      <button type="button" class="prio prio-high" data-priority="高">高</button>
      <button type="button" class="prio prio-mid is-active" data-priority="中">中</button>
      <button type="button" class="prio prio-low" data-priority="低">低</button>
    </div>
    <button id="add-btn" class="add-btn" type="button">添加任务</button>
  </section>

  <nav class="filters">
    <button class="filter is-active" data-filter="all">全部</button>
    <button class="filter" data-filter="active">进行中</button>
    <button class="filter" data-filter="done">已完成</button>
  </nav>

  <ul id="task-list" class="task-list"></ul>
  <div id="empty" class="empty" hidden>
    <div class="empty-icon">✓</div>
    <p>还没有任务，添加第一条开始吧</p>
  </div>

  <footer class="app-footer">
    <span>后端：Express + @supabase/supabase-js</span>
    <span id="stamp"></span>
  </footer>
</div>
<div id="toast" class="toast" hidden></div>
<script src="./app.js"></script>
</body>
</html>
